services:
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      AI_PROVIDER: mock
      MEDIBRIDGE_DB: /app/data/history.db
      CORS_ORIGINS: "http://localhost,http://127.0.0.1"
    volumes:
      - backend-data:/app/data
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  backend-data: